<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | Corvus Forge</title>
<meta name="description" content="Page not found.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M4 20 L14 6 L20 12 L28 8 L22 18 L26 26 L16 22 L8 26 Z' fill='%23e8742c'/></svg>">
<style>
  :root {
    --bg: #0f1114;
    --bg-2: #161a1f;
    --panel: #1b2027;
    --line: #2a313a;
    --text: #e9ecef;
    --muted: #9aa4af;
    --ember: #e8742c;
    --ember-2: #f29a4a;
    --radius: 14px;
    --max: 1120px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 24px; }

  /* Nav */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,17,20,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.04em; font-size: 1.05rem; }
  .brand svg { width: 28px; height: 28px; }
  .nav ul { display: flex; gap: 28px; list-style: none; font-size: 0.95rem; color: var(--muted); }
  .nav ul a:hover { color: var(--text); }
  .btn {
    display: inline-block; padding: 12px 22px; border-radius: 999px;
    background: var(--ember); color: #14100c; font-weight: 600; font-size: 0.95rem;
    transition: background .2s, transform .2s;
  }
  .btn:hover { background: var(--ember-2); transform: translateY(-1px); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--muted); }
  .nav .btn { padding: 9px 18px; }

  /* Hero */
  .hero { padding: 110px 0 90px; position: relative; overflow: hidden; }
  .hero::before {
    content: ""; position: absolute; right: -200px; top: -150px; width: 650px; height: 650px;
    background: radial-gradient(circle, rgba(232,116,44,0.18), transparent 65%);
    pointer-events: none;
  }
  .eyebrow { color: var(--ember); font-weight: 600; font-size: 0.85rem; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 18px; }
  .hero h1 { font-size: clamp(2.4rem, 5.5vw, 4rem); line-height: 1.08; max-width: 820px; letter-spacing: -0.02em; }
  .hero h1 span { color: var(--ember); }
  .hero p.lead { color: var(--muted); font-size: 1.2rem; max-width: 640px; margin: 24px 0 36px; }
  .hero .actions { display: flex; gap: 14px; flex-wrap: wrap; }

  /* Sections */
  section { padding: 90px 0; border-top: 1px solid var(--line); }
  .section-head { max-width: 680px; margin-bottom: 48px; }
  .section-head h2 { font-size: clamp(1.8rem, 3.5vw, 2.5rem); letter-spacing: -0.01em; line-height: 1.2; }
  .section-head p { color: var(--muted); margin-top: 14px; font-size: 1.08rem; }

  .grid { display: grid; gap: 20px; }
  .grid.three { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 28px; transition: border-color .2s, transform .2s;
  }
  .card:hover { border-color: rgba(232,116,44,0.5); transform: translateY(-2px); }
  .card .icon {
    width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
    background: rgba(232,116,44,0.12); color: var(--ember); margin-bottom: 18px;
  }
  .card .icon svg { width: 22px; height: 22px; }
  .card h3 { font-size: 1.15rem; margin-bottom: 8px; }
  .card p { color: var(--muted); font-size: 0.98rem; }

  /* Process */
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; counter-reset: step; }
  .step { position: relative; padding: 28px; border-left: 2px solid var(--line); }
  .step::before {
    counter-increment: step; content: "0" counter(step);
    display: block; font-size: 0.85rem; font-weight: 700; color: var(--ember); letter-spacing: 0.1em; margin-bottom: 10px;
  }
  .step h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .step p { color: var(--muted); font-size: 0.97rem; }

  /* Type I vs II */
  .compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
  .compare .card h3 { display: flex; align-items: baseline; gap: 10px; }
  .compare .tag { font-size: 0.75rem; color: var(--ember); border: 1px solid rgba(232,116,44,0.4); padding: 2px 10px; border-radius: 999px; font-weight: 600; }
  .compare ul { list-style: none; margin-top: 14px; }
  .compare li { color: var(--muted); padding: 7px 0 7px 24px; position: relative; font-size: 0.97rem; }
  .compare li::before { content: ""; position: absolute; left: 0; top: 15px; width: 10px; height: 2px; background: var(--ember); }
  .note { margin-top: 24px; color: var(--muted); font-size: 0.92rem; padding: 16px 20px; border: 1px dashed var(--line); border-radius: 10px; }

  /* Criteria pills */
  .pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .pill { padding: 8px 16px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); font-size: 0.92rem; }
  .pill.core { border-color: rgba(232,116,44,0.6); color: var(--ember-2); }

  /* FAQ */
  details { border-bottom: 1px solid var(--line); padding: 22px 0; }
  details summary { cursor: pointer; font-weight: 600; font-size: 1.08rem; list-style: none; display: flex; justify-content: space-between; gap: 20px; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: "+"; color: var(--ember); font-size: 1.4rem; line-height: 1; transition: transform .2s; }
  details[open] summary::after { transform: rotate(45deg); }
  details p { color: var(--muted); margin-top: 12px; max-width: 760px; }

  /* CTA */
  .cta {
    background: linear-gradient(135deg, #1d1712, #1b2027);
    border: 1px solid rgba(232,116,44,0.35); border-radius: 20px;
    padding: 60px 48px; text-align: center;
  }
  .cta h2 { font-size: clamp(1.8rem, 3.5vw, 2.4rem); margin-bottom: 14px; }
  .cta p { color: var(--muted); max-width: 560px; margin: 0 auto 30px; font-size: 1.08rem; }

  footer { border-top: 1px solid var(--line); padding: 36px 0; color: var(--muted); font-size: 0.9rem; }
  footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 14px; }

  @media (max-width: 760px) {
    .nav ul { display: none; }
    .hero { padding: 80px 0 60px; }
    section { padding: 70px 0; }
    .cta { padding: 44px 24px; }
  }

  /* Security page */
  .doc { padding: 70px 0 90px; }
  .doc h1 { font-size: clamp(2rem, 4.5vw, 3rem); letter-spacing: -0.02em; line-height: 1.15; }
  .doc .lead { color: var(--muted); font-size: 1.12rem; max-width: 720px; margin: 18px 0 0; }
  .doc .status { display: inline-block; margin-top: 22px; font-size: 0.85rem; color: var(--ember-2); border: 1px solid rgba(232,116,44,0.45); padding: 4px 14px; border-radius: 999px; font-weight: 600; }
  .doc h2 { font-size: 1.35rem; margin: 46px 0 12px; }
  .doc p, .doc li { color: var(--muted); max-width: 760px; }
  .doc p + p { margin-top: 12px; }
  .doc ul { margin: 10px 0 0 20px; }
  .doc li { padding: 4px 0; }
  .doc a.inline { color: var(--ember-2); text-decoration: underline; }
  .doc table { border-collapse: collapse; margin-top: 12px; width: 100%; max-width: 760px; font-size: 0.95rem; }
  .doc th, .doc td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .doc th { color: var(--text); font-weight: 600; }
  .doc td { color: var(--muted); }
  .report { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 28px; max-width: 760px; }
  .report p { color: var(--text); }
</style>
</head>
